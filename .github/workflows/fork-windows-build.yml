# Fork-local: every push to `fork` publishes an unsigned Windows installer to the rolling
# `fork-windows` release, and installed builds update from it. That feed needs all of:
# - a version without `-pr.` or `-preview.`, or electron-builder writes no app-update.yml;
# - a regular release, since electron-updater resolves /releases/latest, which skips prereleases;
# - latest.yml and the blockmap beside the installer.

name: Fork Windows build

on:
  push:
    branches:
      - fork
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      FORK_RELEASE_TAG: fork-windows
      # Pinned so the feed never resolves to upstream.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: fmajestic/t3code
    steps:
      # actions/checkout's post-job cleanup fails on the orphaned gitlinks under .repos.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      # Restoring the package cache on Windows measured slower than a fresh install.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install build dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # A hit also skips the Spectre libraries and the desktop build's MSVC preflight.
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: fork-windows-resource-monitor-v1-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      # The runner's MSVC lacks the Spectre-mitigated libraries the resource monitor links against.
      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # .env.example holds T3 Connect's public identifiers; without them there are no cloud features.
      - name: Enable T3 Connect
        shell: bash
        run: cp .env.example .env

      # Next patch plus `-fork.<date>.<run>`: newer than the checkout and every earlier run.
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/server/package.json').version")"
          next="$(node -p "const [a, b, c] = process.argv[1].split('.').map(Number); [a, b, c + 1].join('.')" "$base")"
          version="${next}-fork.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "Building ${version} (checkout is ${base})."
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Align package versions to build version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      # No --wsl-runtime: the backend runs natively, and the WSL toggle falls back to the mounted server tree.
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --verbose

      - name: Publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publish
          shopt -s nullglob
          installers=(release/*.exe)
          manifests=(release/latest.yml)
          blockmaps=(release/*.exe.blockmap)
          if [[ ${#installers[@]} -eq 0 ]]; then
            echo "::error::The build produced no installer."
            exit 1
          fi
          if [[ ${#manifests[@]} -eq 0 || ${#blockmaps[@]} -eq 0 ]]; then
            echo "::error::No latest.yml or blockmap, so the installed app would have no update feed."
            exit 1
          fi
          cp "${installers[@]}" "${manifests[@]}" "${blockmaps[@]}" publish/

          notes="Unsigned Windows x64 build of this fork's \`fork\` branch, replaced on every push. Version \`${{ steps.version.outputs.version }}\`. Check for updates in the app, or reinstall this."

          if ! gh release view "$FORK_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$FORK_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Windows build (fork)" \
              --notes "$notes"
          fi

          # Asset names carry the version, so old ones would otherwise pile up on the rolling release.
          while read -r asset; do
            gh release delete-asset "$FORK_RELEASE_TAG" "$asset" --yes
          done < <(gh release view "$FORK_RELEASE_TAG" --json assets --jq '.assets[].name')

          gh release upload "$FORK_RELEASE_TAG" publish/*
          gh release edit "$FORK_RELEASE_TAG" \
            --title "Windows build (fork)" \
            --notes "$notes" \
            --prerelease=false
